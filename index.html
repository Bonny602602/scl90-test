<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SCL-90测评</title>
  <style>
    /* 基础样式（保证题目能显示） */
    body { 
      font-family: "Microsoft YaHei", sans-serif; 
      background: #f5f7fa; 
      padding: 20px; 
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
    }
    .question { 
      background: #fff; 
      border-radius: 8px; 
      padding: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
    }
    .options { 
      display: flex; 
      gap: 10px; 
      margin-top: 10px; 
    }
    .option { 
      flex: 1; 
      text-align: center; 
      padding: 10px; 
      border: 1px solid #eee; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .option:hover { 
      background: #f8f9fa; 
    }
    .option.selected { 
      background: #4299e1; 
      color: #fff; 
      border-color: #4299e1; 
    }
    .progress { 
      margin: 20px 0; 
      font-size: 14px; 
      color: #666; 
    }
    .progress-bar { 
      height: 6px; 
      background: #eee; 
      border-radius: 3px; 
      margin-top: 5px; 
    }
    .progress-fill { 
      height: 100%; 
      background: #48bb78; 
      border-radius: 3px; 
      width: 0%; 
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SCL-90症状自评量表</h1>
    <p>该量表包含90个项目，涵盖躯体化、强迫症状等9个因子，用于评估近期（1周内）心理状态，请根据实际感受选择。</p>
    <div class="progress">
      进度：<span id="progress-text">0/90</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
    <div id="question-container"></div>
    <button class="btn" id="next-btn" style="display: none;">下一题</button>
  </div>

  <script>
    // 1. 题目数据（90题）
    const questions = [
      "头痛", "神经过敏，心中不踏实", "头脑中有不必要的想法或字句盘旋", "头晕或晕倒", "对异性的兴趣减退",
      "对旁人责备求全", "感到别人能控制您的思想", "责怪别人制造麻烦", "忘记性大", "担心自己的衣饰整齐及仪态的端正",
      "容易烦恼和激动", "胸痛", "害怕空旷的场所或街道", "感到自己的精力下降，活动减慢", "想结束自己的生命",
      "听到旁人听不到的声音", "发抖", "感到大多数人都不可信任", "胃口不好", "容易哭泣",
      "同异性相处时感到害羞不自在", "感到受骗，中了圈套或有人想抓住您", "无缘无故地突然感到害怕", "自己不能控制地大发脾气", "怕单独出门",
      "经常责怪自己", "腰痛", "感到难以完成任务", "感到孤独", "感到苦闷",
      "过分担忧", "对事物不感兴趣", "感到害怕", "您的感情容易受到伤害", "旁人能知道您的私下想法",
      "感到别人不理解您、不同情您", "感到人们对您不友好，不喜欢您", "做事必须做得很慢以保证做得正确", "心跳得很厉害", "恶心或胃部不舒服",
      "感到比不上他人", "肌肉酸痛", "感到有人在监视您、谈论您", "难以入睡", "做事必须反复检查",
      "难以做出决定", "怕乘电车、公共汽车、地铁或火车", "呼吸有困难", "一阵阵发冷或发热", "因为感到害怕而避开某些东西、场合或活动",
      "脑子变空了", "身体发麻或刺痛", "喉咙有梗塞感", "感到前途没有希望", "不能集中注意力",
      "感到身体的某一部分软弱无力", "感到紧张或容易紧张", "感到手或脚发重", "想到死亡的事", "吃得太多",
      "当别人看着您或谈论您时感到不自在", "有一些不属于您自己的想法", "有想打人或伤害他人的冲动", "醒得太早", "必须反复洗手、点数目或触摸某些东西",
      "睡得不稳不深", "有想摔坏或破坏东西的冲动", "有一些别人没有的想法或念头", "感到对别人神经过敏", "在商店或电影院等人多的地方感到不自在",
      "感到任何事情都很困难", "一阵阵恐惧或惊恐", "感到在公共场合吃东西很不舒服", "经常与人争论", "单独一人时神经很紧张",
      "别人对您的成绩没有做出恰当的评价", "即使和别人在一起也感到孤单", "感到坐立不安、心神不定", "感到自己没有什么价值", "感到熟悉的东西变成陌生或不像是真的",
      "大叫或摔东西", "害怕会在公共场合晕倒", "感到别人想占您的便宜", "为一些有关“性”的想法而很苦恼", "您认为应该因为自己的过错而受到惩罚",
      "感到要很快把事情做完", "感到自己的身体有严重问题", "从未感到和其他人很亲近", "感到自己有罪", "感到自己的脑子有毛病"
    ];

    // 2. 全局变量
    let currentIndex = 0; // 当前题目索引
    let answers = new Array(90).fill(null); // 存储答案（1-5）
    const container = document.getElementById('question-container');
    const progressText = document.getElementById('progress-text');
    const progressFill = document.getElementById('progress-fill');

    // 3. 初始化：渲染第一题
    function init() {
      renderQuestion();
      updateProgress();
    }

    // 4. 渲染题目
    function renderQuestion() {
      if (currentIndex >= questions.length) return; // 防止越界

      const q = questions[currentIndex];
      container.innerHTML = `
        <div class="question">
          <p>${currentIndex + 1}. ${q}</p>
          <div class="options">
            <div class="option" data-score="1">1. 没有</div>
            <div class="option" data-score="2">2. 很轻</div>
            <div class="option" data-score="3">3. 中等</div>
            <div class="option" data-score="4">4. 偏重</div>
            <div class="option" data-score="5">5. 严重</div>
          </div>
        </div>
      `;

      // 绑定选项点击事件
      const options = document.querySelectorAll('.option');
      options.forEach(opt => {
        opt.onclick = function() {
          // 清空之前的选中状态
          options.forEach(o => o.classList.remove('selected'));
          this.classList.add('selected');
          answers[currentIndex] = parseInt(this.getAttribute('data-score'));
        };
      });

      // 显示“下一题”按钮（最后一题可换成“提交”）
      document.getElementById('next-btn').style.display = 'block';
      document.getElementById('next-btn').onclick = goNext;
    }

    // 5. 下一题逻辑
    function goNext() {
      if (currentIndex < 89) { // 90题索引0-89
        currentIndex++;
        renderQuestion();
        updateProgress();
      } else {
        // 最后一题，可在此处加“提交”逻辑（比如计算分数）
        alert('已完成90题！可在此处加提交、算分逻辑～');
      }
    }

    // 6. 更新进度条
    function updateProgress() {
      const answered = answers.filter(a => a !== null).length;
      progressText.innerText = `${answered}/90`;
      progressFill.style.width = `${(answered / 90) * 100}%`;
    }

    // 7. 页面加载完自动开始
    window.onload = init;
  </script>
</body>
</html>
